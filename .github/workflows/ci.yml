name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and App Build
    # Swift 6.2 tools for the package, so a macOS 26 runner with a matching Xcode.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path FreewireCore
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >-
          xcodebuild -project Freewire.xcodeproj -scheme Freewire -configuration Release
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build -quiet
