name: Freewire
options:
  bundleIdPrefix: io.github.sergioarojasm98
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  FreewireCore:
    path: FreewireCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4HK3699TX4
    MARKETING_VERSION: "1.2.2"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Freewire:
    type: application
    platform: macOS
    sources:
      - path: Freewire
    dependencies:
      - package: FreewireCore
      - package: Sparkle
    # Merged with the generated Info.plist: Sparkle's feed (the latest GitHub release's appcast) and public key.
    # Automatic checks and installs are on from the first launch, without Sparkle's "check automatically?" prompt.
    info:
      path: Freewire/Info.plist
      properties:
        SUFeedURL: https://github.com/sergioarojasm98/freewire/releases/latest/download/appcast.xml
        SUPublicEDKey: LQuRVtoAyq6MyNZR4p/ejw+P8UXuOSBYU3ltclWNntM=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sergioarojasm98.freewire
        PRODUCT_NAME: Freewire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Freewire
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sergio Rojas"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        # Its own identity, so a Debug build never takes the installed app's login item or defaults
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.sergioarojasm98.freewire.debug
